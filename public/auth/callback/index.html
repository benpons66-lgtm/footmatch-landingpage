<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Adresse mail confirmee - FootMatch</title>
    <meta
      name="description"
      content="Adresse mail confirmee. Redirection vers l'application FootMatch."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel: rgba(16, 23, 19, 0.78);
        --panel-strong: rgba(20, 31, 25, 0.92);
        --green: #39ff88;
        --green-soft: rgba(57, 255, 136, 0.14);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.7);
        --line: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(57, 255, 136, 0.16), transparent 34rem),
          radial-gradient(circle at 12% 80%, rgba(57, 255, 136, 0.08), transparent 24rem),
          linear-gradient(180deg, #07110b 0%, var(--bg) 58%, #000 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 32px, 640px);
        padding: 32px 0;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
      }

      .brand img {
        width: min(260px, 68vw);
        height: auto;
        display: block;
        filter: drop-shadow(0 0 22px rgba(57, 255, 136, 0.28));
      }

      .card {
        position: relative;
        overflow: hidden;
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid var(--line);
        border-radius: 30px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.08), transparent 35%),
          var(--panel);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.48),
          0 0 42px rgba(57, 255, 136, 0.08);
        backdrop-filter: blur(18px);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(57, 255, 136, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(57, 255, 136, 0.035) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .badge {
        width: 74px;
        height: 74px;
        display: inline-grid;
        place-items: center;
        margin-bottom: 22px;
        border: 1px solid rgba(57, 255, 136, 0.42);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 34px;
        box-shadow: 0 0 32px rgba(57, 255, 136, 0.22);
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 58px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .status {
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(17px, 3.5vw, 21px);
        line-height: 1.5;
      }

      .spinner {
        width: 42px;
        height: 42px;
        margin: 28px auto 0;
        border: 3px solid rgba(57, 255, 136, 0.16);
        border-top-color: var(--green);
        border-radius: 999px;
        animation: spin 0.85s linear infinite;
        box-shadow: 0 0 20px rgba(57, 255, 136, 0.22);
      }

      .actions {
        display: none;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 30px;
      }

      .actions.is-visible {
        display: grid;
      }

      .button {
        min-height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 0 22px;
        color: var(--text);
        font-weight: 800;
        font-size: 16px;
        text-decoration: none;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
      }

      .button-primary {
        border-color: rgba(57, 255, 136, 0.7);
        background: var(--green);
        color: #021108;
        box-shadow: 0 0 30px rgba(57, 255, 136, 0.2);
      }

      .button-secondary {
        background: var(--panel-strong);
      }

      .tagline {
        margin: 24px auto 0;
        color: var(--text);
        font-size: 17px;
        font-weight: 800;
      }

      footer {
        margin-top: 28px;
        color: rgba(255, 255, 255, 0.56);
        font-size: 14px;
      }

      footer a {
        color: inherit;
        text-decoration: none;
      }

      footer a:hover {
        color: var(--green);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 560px) {
        .actions {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Retour a FootMatch">
        <img src="/brand/logo-footmatch-transparent.png" alt="FootMatch" />
      </a>

      <section class="card" aria-labelledby="confirmation-title">
        <div class="content">
          <div class="badge" aria-hidden="true">✓</div>
          <h1 id="confirmation-title">Adresse mail confirmée !</h1>
          <p class="status" id="status-message">
            Redirection vers FootMatch en cours...
          </p>
          <div class="spinner" aria-label="Chargement"></div>

          <div class="actions" id="fallback-actions">
            <a class="button button-primary" href="footmatch://" id="open-app">
              Ouvrir FootMatch
            </a>
            <a class="button button-secondary" href="https://footmatch.io" id="download-app">
              Télécharger l'app
            </a>
          </div>

          <p class="tagline">Trouve un match de foot en 30 secondes. Gratuit.</p>
        </div>
      </section>

      <footer>
        © 2026 FootMatch ·
        <a href="mailto:contact@footmatch.io">contact@footmatch.io</a>
      </footer>
    </main>

    <script>
      (function () {
        var appUrl = "footmatch://";
        var fallbackUrl = "https://footmatch.io";
        var userAgent = navigator.userAgent || navigator.vendor || "";
        var downloadButton = document.getElementById("download-app");
        var actions = document.getElementById("fallback-actions");
        var statusMessage = document.getElementById("status-message");
        var openButton = document.getElementById("open-app");

        function getDownloadUrl() {
          if (/android/i.test(userAgent)) {
            return fallbackUrl;
          }

          if (/iPad|iPhone|iPod/.test(userAgent)) {
            return fallbackUrl;
          }

          return fallbackUrl;
        }

        function openApp() {
          window.location.href = appUrl;
        }

        downloadButton.href = getDownloadUrl();
        openButton.addEventListener("click", function (event) {
          event.preventDefault();
          openApp();
        });

        window.setTimeout(openApp, 1000);

        window.setTimeout(function () {
          actions.classList.add("is-visible");
          statusMessage.textContent =
            "Si l'application ne s'ouvre pas automatiquement, utilise les boutons ci-dessous.";
        }, 3000);
      })();
    </script>
  </body>
</html>
